baseURL: "https://55kwukai.github.io/"    # 绑定的域名
title: Kai Wu'Blog
theme: PaperMod

enableInlineShortcodes: true #允许内联短码
enableEmoji: true # 允许使用 Emoji 表情，建议 true
enableRobotsTXT: true  # 允许爬虫抓取到搜索引擎，建议 true

hasCJKLanguage: true # 自动检测是否包含 中文日文韩文 如果文章中使用了很多中文引号的话可以开启

enableGitInfo: true # 用 Git 提交时间作为文章 lastmod
frontmatter:
  date:
    - date # 发布日期只认 frontmatter，不随后续提交变化
  lastmod:
    - :git # 最近一次改动该文件的提交时间
    - date

buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: UA-123-45 #谷歌统计
paginate: 10   # 每页显示的文章数

minify:
  disableXML: true
  # minifyOutput: true   # 压缩网站输出

# permalinks: #浏览器链接显示方式
  # post: "/:title/"
  # post: "/:year/:month/:day/:title/"

# defaultContentLanguage: en # 最顶部首先展示的语言页面
# defaultContentLanguageInSubdir: true  # 多语言使用

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  description: "ExampleSite description"
  keywords: [Blog, Portfolio, PaperMod]
  author: KAI
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  VisitCount: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  hideFooter: true  # 隐藏页脚
  showtoc: true   # 展示目录
  tocopen: true   # 自动

  comments: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: img/favicon.png
    favicon16x16: img/favicon-16x16.ico
    favicon32x32: img/favicon-32x32.ico
    apple_touch_icon: img/apple-touch-icon.png
    safari_pinned_tab: img/safari-pinned-tab.svg

  label:
    text: "Kai Wu"
    icon: img/wukai.jpg
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Kai Wu
    subtitle: "Have A Fun, Guys." 
    imageUrl: "img/wukai.jpg"
    imageWidth: 168
    imageHeight: 168
    imageTitle: Kai
    buttons:
      - name: 👋About
        url: about
      - name: 📔Posts
        url: posts
      - name: 📄Resume
        url: Resume.pdf

  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to my blog! I am now a postgraduate from the Zhejiang University Fluid Power & Mechatronic Systems National Key Lab CAX Group.

  socialIcons:
    - name: twitter
      url: "https://twitter.com/kdd40277279"
    - name: github
      url: "https://github.com/55kwukai"
    - name: linkedin
      url: "https://www.linkedin.com/in/kai-wu-4b2693249/"
    - name: email
      url: "mailto:934313175@qq.com"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  # editPost:
  #   URL: "https://github.com/<path_to_repo>/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: About
      name: 👋About
      url: /about/
      weight: 10
    - identifier: Posts
      name: 📔Posts
      url: /posts/
      weight: 20
    - identifier: Resume
      name: 📄Resume
      url: Resume.pdf
      weight: 30
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  goldmark: 
    renderer: 
      unsafe: true  # HUGO 默认转义 Markdown 文件中的 HTML 代码，如需开启的话
  highlight:
    noClasses: false
    # anchorLineNos: true
    codeFences: true  # 代码围栏功能，这个功能一般都要设为 true 的，不然很难看，就是干巴巴的-代码文字，没有颜色。
    guessSyntax: true # 猜测语法，这个功能建议设置为 true, 如果你没有设置要显示的语言则会自动匹配。
    lineNos: true # 是否显示行号
    style: darcula
    #style: monokai